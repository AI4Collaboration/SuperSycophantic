<svg xmlns="http://www.w3.org/2000/svg" width="1878" height="430" viewBox="0 0 1878 430" role="img" aria-labelledby="title desc">
  <title id="title">SuperSycophantic framework diagram</title>
  <desc id="desc">A clean framework diagram separating context-induced sycophancy from trigger-induced sycophancy, ending in measurement of answer change under unsupported pressure.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .ink { fill: #1f2933; }
      .muted { fill: #5c6773; }
      .faint { fill: #7a858f; }
      .rule { stroke: #c7d0d9; stroke-width: 1.6; }
      .rule-dark { stroke: #7e8a96; stroke-width: 2; }
      .card { fill: #ffffff; stroke: #c4ccd5; stroke-width: 1.7; rx: 5; }
      .band-left { fill: #f3f7fb; stroke: #b9cadb; stroke-width: 1.4; rx: 5; }
      .band-right { fill: #fbf5f1; stroke: #d7b8a9; stroke-width: 1.4; rx: 5; }
      .chip-blue { fill: #eef4fb; stroke: #b8cadb; stroke-width: 1.1; rx: 4; }
      .chip-red { fill: #fbf1ee; stroke: #d7b8a9; stroke-width: 1.1; rx: 4; }
      .chip-green { fill: #f1f8f3; stroke: #b8d1c0; stroke-width: 1.1; rx: 4; }
      .chip-gray { fill: #f6f7f8; stroke: #c9d0d6; stroke-width: 1.1; rx: 4; }
      .chip-gold { fill: #fff8e6; stroke: #d9c58b; stroke-width: 1.1; rx: 4; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; letter-spacing: 0; }
      .subhead { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 400; letter-spacing: 0; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 400; letter-spacing: 0; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 400; letter-spacing: 0; }
      .chiptext { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0; }
      .mono { font-family: "Arial Narrow", Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4.5 L 0 9" fill="none" stroke="#6f7c88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1878" height="430"/>

  <!-- Regime headers -->
  <rect class="band-left" x="56" y="34" width="709" height="56"/>
  <text class="subhead ink" x="410.5" y="58" text-anchor="middle">Context-induced sycophancy</text>
  <text class="small muted" x="410.5" y="79" text-anchor="middle">user framing acts before the first answer</text>

  <rect class="band-right" x="830" y="34" width="1046" height="56"/>
  <text class="subhead ink" x="1353" y="58" text-anchor="middle">Trigger-induced sycophancy</text>
  <text class="small muted" x="1353" y="79" text-anchor="middle">unsupported pressure acts after an initial commitment</text>

  <!-- Main row cards -->
  <rect class="card" x="56" y="122" width="230" height="164"/>
  <text class="label ink" x="171" y="153" text-anchor="middle">Context</text>
  <text class="small muted" x="171" y="179" text-anchor="middle">realistic A/B decision</text>
  <rect class="chip-blue" x="82" y="199" width="68" height="27"/>
  <text class="tiny ink" x="116" y="218" text-anchor="middle">STEM</text>
  <rect class="chip-green" x="158" y="199" width="82" height="27"/>
  <text class="tiny ink" x="199" y="218" text-anchor="middle">Health</text>
  <rect class="chip-gray" x="82" y="235" width="78" height="27"/>
  <text class="tiny ink" x="121" y="254" text-anchor="middle">Social</text>
  <rect class="chip-gold" x="168" y="235" width="72" height="27"/>
  <text class="tiny ink" x="204" y="254" text-anchor="middle">Human.</text>

  <rect class="card" x="308" y="122" width="185" height="164"/>
  <text class="label ink" x="400.5" y="153" text-anchor="middle">Verifiability</text>
  <rect class="chip-blue" x="334" y="189" width="60" height="40"/>
  <text class="mono ink" x="364" y="215" text-anchor="middle">GT</text>
  <text class="tiny muted" x="430" y="207" text-anchor="middle">single</text>
  <text class="tiny muted" x="430" y="224" text-anchor="middle">truth label</text>
  <rect class="chip-gray" x="334" y="239" width="60" height="40"/>
  <text class="mono ink" x="364" y="265" text-anchor="middle">NGT</text>
  <text class="tiny muted" x="430" y="257" text-anchor="middle">two stable</text>
  <text class="tiny muted" x="430" y="274" text-anchor="middle">answer states</text>

  <rect class="card" x="515" y="122" width="250" height="164"/>
  <text class="label ink" x="640" y="153" text-anchor="middle">Framing</text>
  <text class="small muted" x="640" y="179" text-anchor="middle">first-turn user cue</text>
  <rect class="chip-blue" x="544" y="200" width="89" height="28"/>
  <text class="chiptext ink" x="588.5" y="219" text-anchor="middle">Identity</text>
  <rect class="chip-blue" x="647" y="200" width="89" height="28"/>
  <text class="chiptext ink" x="691.5" y="219" text-anchor="middle">Belief</text>
  <rect class="chip-blue" x="544" y="238" width="89" height="28"/>
  <text class="chiptext ink" x="588.5" y="257" text-anchor="middle">Affect</text>
  <rect class="chip-blue" x="647" y="238" width="89" height="28"/>
  <text class="chiptext ink" x="691.5" y="257" text-anchor="middle">Stake</text>

  <circle cx="797" cy="204" r="20" fill="#f6f7f8" stroke="#c9d0d6" stroke-width="1.2"/>
  <text class="tiny muted" x="797" y="194" text-anchor="middle">commit</text>
  <text class="mono ink" x="797" y="215" text-anchor="middle">A/B</text>

  <rect class="card" x="830" y="122" width="337" height="164"/>
  <text class="label ink" x="998.5" y="153" text-anchor="middle">Trigger</text>
  <text class="small muted" x="998.5" y="178" text-anchor="middle">unsupported social pressure</text>
  <rect class="chip-red" x="856" y="196" width="76" height="25"/>
  <text class="tiny ink" x="894" y="214" text-anchor="middle">Authority</text>
  <rect class="chip-red" x="940" y="196" width="82" height="25"/>
  <text class="tiny ink" x="981" y="214" text-anchor="middle">Social proof</text>
  <rect class="chip-red" x="1030" y="196" width="86" height="25"/>
  <text class="tiny ink" x="1073" y="214" text-anchor="middle">Consistency</text>
  <rect class="chip-red" x="1124" y="196" width="42" height="25"/>
  <text class="tiny ink" x="1145" y="214" text-anchor="middle">Unity</text>
  <rect class="chip-red" x="856" y="232" width="83" height="25"/>
  <text class="tiny ink" x="897.5" y="250" text-anchor="middle">Reciprocity</text>
  <rect class="chip-red" x="947" y="232" width="58" height="25"/>
  <text class="tiny ink" x="976" y="250" text-anchor="middle">Liking</text>
  <rect class="chip-red" x="1013" y="232" width="65" height="25"/>
  <text class="tiny ink" x="1045.5" y="250" text-anchor="middle">Scarcity</text>
  <rect class="chip-red" x="1086" y="232" width="66" height="25"/>
  <text class="tiny ink" x="1119" y="250" text-anchor="middle">Baseline</text>
  <text class="tiny faint" x="998.5" y="274" text-anchor="middle">no new task evidence</text>

  <rect class="card" x="1189" y="122" width="260" height="164"/>
  <text class="label ink" x="1319" y="153" text-anchor="middle">Temporal</text>
  <text class="small muted" x="1319" y="178" text-anchor="middle">multi-turn pressure schedule</text>
  <text class="tiny ink" x="1225" y="207">Repetition</text>
  <path d="M 1315 202 H 1405" class="rule-dark" marker-end="url(#arrow)"/>
  <text class="tiny ink" x="1225" y="232">Combined</text>
  <path d="M 1315 227 C 1340 214, 1366 240, 1405 226" fill="none" class="rule-dark" marker-end="url(#arrow)"/>
  <text class="tiny ink" x="1225" y="257">Escalation</text>
  <path d="M 1315 260 L 1345 252 L 1375 242 L 1405 228" fill="none" class="rule-dark" marker-end="url(#arrow)"/>
  <text class="tiny ink" x="1225" y="278">De-escal.</text>
  <path d="M 1315 269 L 1345 261 L 1375 253 L 1405 249" fill="none" class="rule-dark" marker-end="url(#arrow)"/>

  <rect class="card" x="1471" y="122" width="405" height="164"/>
  <text class="label ink" x="1673.5" y="153" text-anchor="middle">Measurement</text>
  <text class="small muted" x="1673.5" y="178" text-anchor="middle">observable answer revision and response posture</text>
  <rect class="chip-gray" x="1500" y="200" width="135" height="28"/>
  <text class="chiptext ink" x="1567.5" y="219" text-anchor="middle">stance labels</text>
  <rect class="chip-gray" x="1647" y="200" width="198" height="28"/>
  <text class="chiptext ink" x="1746" y="219" text-anchor="middle">pressure-aligned switch</text>
  <rect class="chip-gold" x="1500" y="240" width="110" height="28"/>
  <text class="tiny ink" x="1555" y="259" text-anchor="middle">uncritical</text>
  <rect class="chip-gold" x="1621" y="240" width="125" height="28"/>
  <text class="tiny ink" x="1683.5" y="259" text-anchor="middle">obsequious</text>
  <rect class="chip-gold" x="1757" y="240" width="88" height="28"/>
  <text class="tiny ink" x="1801" y="259" text-anchor="middle">excited</text>

  <!-- Connectors -->
  <path d="M 286 204 H 303" class="rule-dark" marker-end="url(#arrow)"/>
  <path d="M 493 204 H 510" class="rule-dark" marker-end="url(#arrow)"/>
  <path d="M 765 204 H 772" class="rule-dark" marker-end="url(#arrow)"/>
  <path d="M 817 204 H 825" class="rule-dark" marker-end="url(#arrow)"/>
  <path d="M 1167 204 H 1184" class="rule-dark" marker-end="url(#arrow)"/>
  <path d="M 1449 204 H 1466" class="rule-dark" marker-end="url(#arrow)"/>

  <!-- Bottom endpoint strip -->
  <rect x="56" y="326" width="1820" height="66" rx="5" fill="#fbfbfc" stroke="#cbd3dc" stroke-width="1.5"/>
  <text class="subhead ink" x="116" y="354">Primary endpoint</text>
  <text class="body ink" x="324" y="354">answer change under unsupported pressure</text>
  <path d="M 680 349 H 748" class="rule-dark" marker-end="url(#arrow)"/>
  <text class="small muted" x="781" y="354">eligible trials require a committed initial answer</text>
  <path d="M 1110 349 H 1178" class="rule-dark" marker-end="url(#arrow)"/>
  <text class="small muted" x="1212" y="354">secondary analyses track GT preservation/departure and scale factors</text>
  <text class="tiny faint" x="116" y="379">The task evidence is held fixed; switches are counted only when the model moves between stable answer states.</text>
</svg>
